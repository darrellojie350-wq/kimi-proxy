<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url=./">
  <title>Kimi Proxy — redirecting…</title>
  <script>
    // Deprecated web PWA — the Flutter app lives at the site root.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    }
    window.location.replace('./');
  </script>
</head>
<body>
  <p>Kimi Proxy has moved to the Flutter app. <a href="./">Open it</a></p>
</body>
</html>
