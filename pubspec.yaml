name: kimi_proxy
description: Ultra-fast premium Kimi Code CLI remote client — streaming thinking, tools, sessions
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.4+1
  markdown: ^7.2.2
  url_launcher: ^6.3.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#0A0B0F"
  adaptive_icon_foreground: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/
