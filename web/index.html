<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kimi Proxy — ultra-fast remote client for Kimi Code CLI">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi Proxy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #0A0B0F; }
    .loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #8B90A0; font-family: system-ui, sans-serif; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Loading Kimi Proxy…</div>
  <script>
    // Bootstrap error trap — surfaces startup failures for debugging.
    window.__bootErrors = [];
    window.addEventListener('error', function (e) {
      window.__bootErrors.push(String(e.message || e.error || '').slice(0, 400));
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootErrors.push('rejection: ' + String(e.reason).slice(0, 400));
    });
    setTimeout(function () {
      if (window.__bootErrors && window.__bootErrors.length) {
        var el = document.getElementById('loading');
        if (el) { el.textContent = 'Boot error: ' + window.__bootErrors.join(' | '); el.style.whiteSpace = 'pre-wrap'; el.style.maxWidth = '80vw'; }
      }
    }, 10000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Clear the legacy PWA service worker (webapp era) that cache-first serves
    // the old shell and would mask this Flutter app indefinitely.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        for (const r of regs) {
          const scope = r.scope || '';
          if (scope.includes('/kimi-proxy/')) r.unregister();
        }
      }).catch(() => {});
      if (window.caches && caches.keys) {
        caches.keys().then((keys) => {
          for (const k of keys) if (!k.includes('flutter')) caches.delete(k);
        }).catch(() => {});
      }
    }
    window.addEventListener('flutter-first-frame', () => {
      const el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
