name: Deploy Kimi Proxy Web PWA

on:
  push:
    branches: [main]
    paths: ['webapp/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        name: Deploy to Pages
        uses: actions/deploy-pages@v4