name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create . --project-name kimi_proxy --org com.kimiproxy.app --platforms=android || true

      - name: Restore sources
        run: |
          git checkout HEAD -- lib pubspec.yaml analysis_options.yaml assets || true
          mkdir -p assets && test -f assets/icon.png || true

      - name: compileSdk 36 + app name + icon
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          fi
          # Use debug signing for release artifact until keystore provided (still release mode)
          mkdir -p android/app/src/main/res/drawable
          cp assets/icon.png android/app/src/main/res/drawable/ic_launcher_foreground.png || true

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kimi-proxy-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
