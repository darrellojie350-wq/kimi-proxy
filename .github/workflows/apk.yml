name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create . --project-name kimi_proxy --org com.kimiproxy.app --platforms=android || true

      - name: Restore our sources
        run: |
          git checkout HEAD -- lib pubspec.yaml analysis_options.yaml assets || true
          mkdir -p assets && touch assets/.gitkeep

      - name: Bump compileSdk to 36
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle || true
          fi
          grep -n compileSdk android/app/build.gradle* || true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: kimi-proxy-apk
          path: build/app/outputs/flutter-apk/*.apk
